version: 2

# 输入：clean 层（由 sql/clean/ 维护，dbt 只读）
sources:
  - name: clean
    schema: clean
    tables:
      - name: trades
        description: 合格、去重后的成交
      - name: prices
        description: 合格、去重后的报价（股票和汇率）
